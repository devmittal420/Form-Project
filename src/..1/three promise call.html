<script>
  const Promise1 = () => {
    return new Promise((resolve, reject) => {
      resolve("Promise 1 success");
    });
  };
  const Promise2 = () => {
    return new Promise((resolve, reject) => {
      reject("promise 2 err");
    });
  };
  const Promise3 = () => {
    return new Promise((resolve, reject) => {
      resolve("Promise 3 success");
    });
  };

  Promise1()
    .then((result) => {
      console.log(result);
      return Promise2();
    })
    .then((result2) => {
      console.log(result2);
      return Promise3();
    })
    .then((result3) => {
      console.log(result3);
    })
    .catch((err) => console.log(err));
</script>
